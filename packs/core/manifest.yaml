# Core pack — universal skills shipped with every install
# Compile: bash scripts/compile_registry.sh → manifest.json

id: core
name: Universal Core
description: Stack detection, stack profiles, and universal testing. Required baseline before pattern packs.
version: "1.0"
depends_on: []

skills:
  # Core workflow skills
  - stack-detection
  - stack-loader
  - testing-universal
  - intent-router
  - feature
  - fix
  - plan
  - review
  - ship
  - work-intake
  - resolve-task
  - tracker-sync
  - comprehension-check
  - retrospect
  - spec-lint

# Stack profiles are data, not Claude Code skills: they live at
# skills/stacks/<id>/profile.yaml and are read by `stack-loader` and
# `kit detect-stack`. Claude Code only discovers skills one directory deep
# under a skills root, so listing them here would advertise skills that can
# never load.
# Review: docs/skills-review.md (human sign-off in PR, not in repo)
