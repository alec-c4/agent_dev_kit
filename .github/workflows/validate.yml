name: Validate

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: none

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-detect.txt

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install -r scripts/requirements-detect.txt

      - name: Compile registry
        run: ./scripts/kit compile

      # Compiled JSON is committed; a YAML change without a recompile would
      # otherwise pass CI and ship a stale registry.
      - name: Registry JSON matches YAML
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::compiled JSON is out of date — run ./scripts/kit compile and commit the result"
            exit 1
          fi

      - name: Install kit-runtime dev dependencies
        run: bun install --frozen-lockfile
        working-directory: packages/kit-runtime

      - name: Typecheck kit-runtime
        run: bun run typecheck
        working-directory: packages/kit-runtime

      - name: Unit tests and golden parity (Bun vs Python)
        run: bun test
        working-directory: packages/kit-runtime

      - name: Validate kit (phase 1)
        run: ./scripts/kit validate --phase=1

      - name: Validate core skills pack
        run: ./scripts/kit validate-skills --pack=core

      - name: Validate patterns skills pack
        run: ./scripts/kit validate-skills --pack=patterns

      - name: Validate topics skills pack
        run: ./scripts/kit validate-skills --pack=topics

      - name: Validate stack pack manifests
        run: |
          ./scripts/kit validate-skills --pack=rails
          ./scripts/kit validate-skills --pack=node
          ./scripts/kit validate-skills --pack=python
          ./scripts/kit validate-skills --pack=go
          ./scripts/kit validate-skills --pack=elixir
          ./scripts/kit validate-skills --pack=devops
          ./scripts/kit validate-skills --pack=astro
          ./scripts/kit validate-skills --pack=tauri
          ./scripts/kit validate-skills --pack=swift
          ./scripts/kit validate-skills --pack=kotlin
          ./scripts/kit validate-skills --pack=react-native
          ./scripts/kit validate-skills --pack=flutter

      - name: Validate kit (full)
        run: ./scripts/kit validate

      - name: Shellcheck scripts and hooks
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning --external-sources \
            scripts/kit scripts/*.sh scripts/lib/*.sh hooks/*.sh hooks/lib/*.sh hooks/cursor/*.sh
