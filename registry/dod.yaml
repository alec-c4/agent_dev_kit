# Definition of Done — universal criteria only
# Stack-specific overlays: skills/stacks/<id>/profile.yaml → dod_overlay
# Consumed by: detect-stack.sh, stack-loader, review workflow
version: 1

universal:
  - id: tests_critical_paths
    label: Critical behaviours have focused tests (AC/integrity); no tests-for-coverage padding
  - id: tests_role_access_matrix
    label: Permission-sensitive changes cover allow+deny for relevant roles/scopes (anonymous, wrong role, wrong resource, intended role, elevated if any)
  - id: no_secrets
    label: No hardcoded credentials, tokens, or API keys
  - id: linter_clean
    label: Linter passes on changed files (commands from stack profile)
  - id: security_scan
    label: Security / dependency scan passes when stack profile defines tooling.security or deps_audit
  - id: no_commented_code
    label: No commented-out code left in the diff
  - id: types_correct
    label: Types correct where applicable (per stack profile tooling.typecheck)
  - id: authorization_checked
    label: Authorization verified before data access on protected resources
  - id: business_logic_layer
    label: Business logic not in views/templates/handlers only — service layer used
